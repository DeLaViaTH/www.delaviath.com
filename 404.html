<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Page not found — DeLaViaTH</title>
  <meta name="description" content="That page does not exist. Head back to the home page or browse the project list.">
  <meta name="robots" content="noindex">

  <meta name="theme-color" content="#0b0e14">
  <meta name="color-scheme" content="dark">

  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/base.css">

  <script src="/js/site.js" defer></script>
  <script src="/js/router.js" defer></script>
  <script src="/js/background-video.js" defer></script>
  <script src="/js/projects-filter.js" defer></script>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div id="background-container"></div>

  <div id="navbar-container"></div>

  <main id="main" class="container">
    <div class="error-page">
      <div>
        <span class="error-page__code">404</span>
        <h1>This page does not exist</h1>
        <p>
          The link may be out of date, or the page may have moved during the site rebuild.
          Everything that exists is reachable from the navigation above.
        </p>
        <div class="error-page__actions">
          <a class="btn btn--primary" href="/">Back to home</a>
          <a class="btn btn--ghost" href="/projects">Browse projects</a>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>
</body>

</html>
